<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Local Models</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f0f0f0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Test Local Face-API Models</h1>
        <div id="status" class="status info">Testing models...</div>
        <div id="results"></div>
    </div>

    <script src="../resources/assets/javascript/face_logics/face-api.min.js"></script>
    <script>
        async function testModels() {
            const statusDiv = document.getElementById('status');
            const resultsDiv = document.getElementById('results');
            
            try {
                statusDiv.textContent = 'Loading models from local directory...';
                statusDiv.className = 'status info';
                
                // Test loading all models from local directory
                await Promise.all([
                    faceapi.nets.ssdMobilenetv1.loadFromUri('./models'),
                    faceapi.nets.faceRecognitionNet.loadFromUri('./models'),
                    faceapi.nets.faceLandmark68Net.loadFromUri('./models'),
                    faceapi.nets.tinyFaceDetector.loadFromUri('./models'),
                    faceapi.nets.faceLandmark68TinyNet.loadFromUri('./models'),
                    faceapi.nets.mtcnn.loadFromUri('./models'),
                    faceapi.nets.faceExpressionNet.loadFromUri('./models'),
                    faceapi.nets.ageGenderNet.loadFromUri('./models')
                ]);
                
                statusDiv.textContent = 'Models loaded successfully!';
                statusDiv.className = 'status success';
                
                resultsDiv.innerHTML = `
                    <h3>✅ All Tests Passed</h3>
                    <ul>
                        <li>face-api.min.js loaded successfully</li>
                        <li>SSD MobileNet v1 model loaded from local directory</li>
                        <li>Face Recognition model loaded from local directory</li>
                        <li>Face Landmark 68 model loaded from local directory</li>
                        <li>Tiny Face Detector model loaded from local directory</li>
                        <li>Face Landmark 68 Tiny model loaded from local directory</li>
                        <li>MTCNN model loaded from local directory</li>
                        <li>Face Expression model loaded from local directory</li>
                        <li>Age Gender model loaded from local directory</li>
                    </ul>
                    <p>All 18 model files have been successfully copied and are working locally!</p>
                `;
                
            } catch (error) {
                statusDiv.textContent = 'Error loading models: ' + error.message;
                statusDiv.className = 'status error';
                
                resultsDiv.innerHTML = `
                    <h3>❌ Test Failed</h3>
                    <p><strong>Error:</strong> ${error.message}</p>
                    <p>Please check:</p>
                    <ul>
                        <li>face-api.min.js exists in ../resources/assets/javascript/face_logics/</li>
                        <li>Model files exist in ./models/ directory</li>
                        <li>Web server has permission to access these files</li>
                    </ul>
                `;
            }
        }
        
        // Run test when page loads
        window.addEventListener('load', testModels);
    </script>
</body>
</html>
